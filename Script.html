<script>
    let rawData = []; let modalDataLists = { main: { active: [], pending: [], overdue: [], unfinished: [] }, sub: { active: [], pending: [], overdue: [], unfinished: [] }, perf: { created: [], completed: [] }, mytasks: { owner: [], assignee: [], my_overdue: [] } };
    let globalDropdowns = { brand: [], category: [], priority: [], taskStatus: [], employees: {}, subCategory: [], subTaskStatus: [], approvers: [] };
    let userAuth = { overview: "NO", personal: "PERSONAL", add: "NO", name: "" }; 

    window.onload = function() { 
        try { 
            initDatePickers(); 
            loadSettingsDropdown(); 
        } catch (e) { alert("🚨 Error โหลดหน้าแรก: " + e.message); } 
    };

    function escapeInlineStr(str) { return String(str || "").replace(/\\/g, "\\\\").replace(/'/g, "\\'").replace(/"/g, "&quot;").replace(/\r/g, "").replace(/\n/g, "<br>"); }
    
    // 🚨 ควบคุมการเปิดปิด Dropdown แบบหลายรายชื่อ
    function toggleMultiSelect(container, event) { document.querySelectorAll('.multi-select-dropdown').forEach(el => { if (el !== container.querySelector('.multi-select-dropdown')) el.classList.remove('show'); }); container.querySelector('.multi-select-dropdown').classList.toggle('show'); event.stopPropagation(); }
    document.addEventListener('click', function(e) { if(!e.target.closest('.multi-select-container')) { document.querySelectorAll('.multi-select-dropdown').forEach(el => el.classList.remove('show')); } });
    function updateMultiSelectText(checkbox) { let container = checkbox.closest('.multi-select-container'); let checked = Array.from(container.querySelectorAll('.sub-assign-cb:checked')).map(cb => cb.value); let textSpan = container.querySelector('.selected-text'); if(checked.length === 0) { textSpan.innerText = "-- เลือกผู้รับผิดชอบ --"; textSpan.style.color = "#7f8c8d"; } else if(checked.length <= 2) { textSpan.innerText = checked.join(', '); textSpan.style.color = "#2c3e50"; } else { textSpan.innerText = `เลือกแล้ว ${checked.length} คน`; textSpan.style.color = "#2980b9"; textSpan.style.fontWeight = "bold"; } }

    // 🚨 ยืนยันการบังคับปฏิทิน ไม่ให้มือถือแทรกแซง
    function initDatePickers() { try { document.querySelectorAll(".date-picker").forEach(el => { if(!el._flatpickr) { flatpickr(el, { enableTime: true, time_24hr: true, dateFormat: "d/m/Y H:i", locale: "th", disableMobile: true }); } }); bindMainDateEvent('mainDueDate', '#subTasksContainer .sub-due'); bindMainDateEvent('editMainDue', '#editSubTasksContainer .sub-due'); bindMainDateEvent('manageDueDate', '#extraSubTasksContainer .sub-due'); } catch(e) { console.error(e); } }
    
    function bindMainDateEvent(mainId, subSelector) { let mainEl = document.getElementById(mainId); if(mainEl && mainEl._flatpickr) { if(mainEl._flatpickr.selectedDates.length > 0) { let maxD = mainEl._flatpickr.selectedDates[0]; document.querySelectorAll(subSelector).forEach(subEl => { if(subEl._flatpickr) subEl._flatpickr.set('maxDate', maxD); }); } if(!mainEl.dataset.eventBound) { mainEl._flatpickr.config.onChange.push(function(selectedDates) { let maxD = selectedDates[0] || null; document.querySelectorAll(subSelector).forEach(subEl => { if(subEl._flatpickr) subEl._flatpickr.set('maxDate', maxD); }); }); mainEl.dataset.eventBound = "true"; } } }
    const safeCompare = (str1, str2) => { return (str1 || "").toString().replace(/\s+/g, '').toLowerCase() === (str2 || "").toString().replace(/\s+/g, '').toLowerCase() && (str1 || "").toString().trim() !== ""; };
    function setNow(btnEl) { let inputEl = btnEl.previousElementSibling; if(inputEl && inputEl._flatpickr) { let now = new Date(); inputEl._flatpickr.setDate(now, true); } }
    function parseDate(dateStr) { if(!dateStr || dateStr === '-') return new Date(9999, 0, 1); try { let str = dateStr.toString().trim(); let d = new Date(str); if (!isNaN(d.getTime()) && str.includes('T')) return d; let parts = str.split(/[ \T]/); let dmy = parts[0].split(/[\/-]/); if(dmy.length === 3) { let y = parseInt(dmy[2]); if(y > 2500) y -= 543; let m = parseInt(dmy[1]) - 1; let date = parseInt(dmy[0]); if(m >= 12) { let t = m+1; m = date-1; date = t; } if(date > 1000) { y = date; if(y > 2500) y -= 543; date = parseInt(dmy[2]); } let time = parts[1] ? parts[1].split(':') : [0,0]; let hh = parseInt(time[0]) || 0; let mm = parseInt(time[1]) || 0; let fDate = new Date(y, m, date, hh, mm); if (!isNaN(fDate.getTime())) return fDate; } return new Date(9999, 0, 1); } catch(e) { return new Date(9999, 0, 1); } }
    function getCountdownText(dateObj) { let now = new Date(); let diffMs = dateObj - now; let isOverdue = diffMs < 0; let absDiff = Math.abs(diffMs); let days = Math.floor(absDiff / (1000 * 60 * 60 * 24)); let hours = Math.floor((absDiff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)); let mins = Math.floor((absDiff % (1000 * 60 * 60)) / (1000 * 60)); if (isOverdue) { return days > 0 ? `<span style="color:#c0392b; font-weight:bold; margin-left:8px;">(🚨 ล่าช้า ${days} วัน ${hours} ชม.)</span>` : (hours > 0 ? `<span style="color:#c0392b; font-weight:bold; margin-left:8px;">(🚨 ล่าช้า ${hours} ชม. ${mins} นาที)</span>` : `<span style="color:#c0392b; font-weight:bold; margin-left:8px;">(🚨 ล่าช้า ${mins} นาที)</span>`); } else { return days > 0 ? `<span style="color:#27ae60; font-weight:bold; margin-left:8px;">(⏳ เหลือ ${days} วัน ${hours} ชม.)</span>` : (hours > 0 ? `<span style="color:#e67e22; font-weight:bold; margin-left:8px;">(⏳ เหลือ ${hours} ชม. ${mins} นาที)</span>` : `<span style="color:#e74c3c; font-weight:bold; margin-left:8px;">(⏳ เหลือ ${mins} นาที!)</span>`); } }

    function switchView(viewId, btnId) { document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active')); document.querySelectorAll('.navbar button').forEach(el => el.classList.remove('active')); let targetView = document.getElementById(viewId); let targetBtn = document.getElementById(btnId); if(targetView) targetView.classList.add('active'); if(targetBtn) targetBtn.classList.add('active'); if(viewId === 'myTasksView') renderMyTasks(); if(viewId === 'archiveView') renderArchive(); if(viewId === 'createView') resetCreateForm(); }
    function resetCreateForm() { let elName = document.getElementById('mainTaskName'); if(elName) elName.value = ''; let elBrand = document.getElementById('mainBrand'); if(elBrand) elBrand.selectedIndex = 0; let elCat = document.getElementById('mainCategory'); if(elCat) elCat.selectedIndex = 0; let elPri = document.getElementById('mainPriority'); if(elPri) elPri.selectedIndex = 0; let elAss = document.getElementById('mainAssignee'); if(elAss) elAss.selectedIndex = 0; let elAppr = document.getElementById('mainApprover'); if(elAppr) elAppr.selectedIndex = 0; let elLink = document.getElementById('mainResultLink'); if(elLink) elLink.value = ''; let elRem = document.getElementById('mainRemark'); if(elRem) elRem.value = ''; document.querySelectorAll('#createView input.date-picker').forEach(el => { if(el._flatpickr) el._flatpickr.clear(); }); let subCont = document.getElementById('subTasksContainer'); if(subCont) { subCont.innerHTML = ''; addSubTask(); } }
    function closeModal() { document.getElementById('taskModal').style.display = 'none'; }
    function closeListModal() { document.getElementById('listModal').style.display = 'none'; }
    function closeListModalMyTasks() { document.getElementById('listModalMyTasks').style.display = 'none'; }
    function closeManageProject() { document.getElementById('manageProjectModal').style.display = 'none'; document.getElementById('editSubTasksContainer').innerHTML = ''; }

    function showProjectOverview(projCode) {
        let proj = rawData.find(p => p.code === projCode); if(!proj) return;
        document.getElementById('listModalTitleMyTasks').innerText = `👁️ ภาพรวมโปรเจกต์: ${projCode}`;
        
        let html = `
        <div style="background:#f4f6f7; padding:12px; border-radius:6px; margin-bottom:15px; border-left:4px solid #3498db; font-size:13px;">
            <h4 style="margin:0 0 8px 0; color:#2c3e50;">${proj.name}</h4>
            <div style="margin-bottom:4px;">👤 <strong>ผู้คุม (Owner):</strong> ${proj.owner}</div>
            <div style="margin-bottom:4px;">🚩 <strong>กำหนดส่งหลัก:</strong> ${proj.dueDate}</div>
            <div style="margin-bottom:4px;">📌 <strong>สถานะหลัก:</strong> ${proj.status}</div>
            <div style="margin-bottom:4px;">📝 <strong>หมายเหตุ:</strong> ${proj.remark ? proj.remark.replace(/\n/g, '<br>') : '-'}</div>
            <div>🔗 <strong>ลิงก์ผลงานรวม:</strong> ${proj.resultLink ? `<a href="${proj.resultLink}" target="_blank" style="color:#3498db; text-decoration:none; font-weight:bold;">คลิกดูผลงาน</a>` : '-'}</div>
        </div>
        <h4 style="border-bottom: 2px solid #ecf0f1; padding-bottom: 5px; margin-bottom:10px; color:#2c3e50;">📋 งานย่อยทั้งหมดในโปรเจกต์นี้</h4>`;
        
        proj.subTasks.forEach(sub => {
            let isDone = (sub.status || "").includes('เสร็จ'); let borderCol = isDone ? '#27ae60' : '#f39c12'; let bgCol = isDone ? '#f9fff9' : '#fff';
            let linkHtml = (sub.resultLink && sub.resultLink.trim() !== "") ? `<div style="margin-top:6px;"><a href="${sub.resultLink}" target="_blank" style="display:inline-block; background:#9b59b6; color:white; padding:4px 8px; border-radius:4px; text-decoration:none; font-size:11px; font-weight:bold;">🔗 เปิดดูลิงก์ผลงานแนบ</a></div>` : '';
            
            // 🚨 แปลง \n เป็น <br> ให้โชว์หลายบรรทัด
            let safeRemarkText = escapeInlineStr(sub.remark);
            let remarkHtml = (sub.remark && sub.remark.trim() !== "") ? `<div style="color:#e67e22; font-size:11px; margin-top:2px;">💬 หมายเหตุ: <br>${safeRemarkText}</div>` : '';

            html += `
            <div style="background:${bgCol}; border: 1px solid #e1e8ed; border-left: 4px solid ${borderCol}; padding: 10px; margin-bottom: 8px; border-radius: 4px;">
                <div style="font-weight:bold; color:#2c3e50; font-size:13px; margin-bottom:4px;">${sub.subName}</div>
                <div style="font-size:12px; color:#7f8c8d; display:flex; flex-direction:column; gap:3px;">
                    <div>👤 <strong>ผู้รับผิดชอบ:</strong> ${sub.assignee || '-'}</div>
                    <div>📌 <strong>สถานะ:</strong> <span style="color:${borderCol}; font-weight:bold;">${sub.status}</span></div>
                    <div>🚀 <strong>เริ่มงาน:</strong> ${sub.startDate || '-'}</div>
                    <div>📅 <strong>กำหนดส่ง:</strong> ${sub.dueDate}</div>
                    ${remarkHtml}
                    ${linkHtml}
                </div>
            </div>`;
        });
        document.getElementById('listModalBodyMyTasks').innerHTML = html; document.getElementById('listModalMyTasks').style.display = 'flex';
    }

    function openListModal(type, category) { 
        let typeName = ""; let catName = ""; if (type === 'main') typeName = 'โปรเจกต์หลัก'; else if (type === 'sub') typeName = 'งานย่อย'; else if (type === 'perf') typeName = 'สถิติ'; if(category === 'active') catName = "ที่กำลังทำอยู่"; else if(category === 'pending') catName = "ที่รอตรวจสอบ"; else if(category === 'overdue') catName = "ที่ 🚨 เลยกำหนดส่ง"; else if(category === 'unfinished') catName = "ที่ยังไม่เสร็จทั้งหมด"; else if(category === 'created') catName = "โปรเจกต์ทั้งหมดในช่วงเวลาที่กรอง"; else if(category === 'completed') catName = "โปรเจกต์ที่ปิดจ็อบแล้ว"; 
        document.getElementById('listModalTitle').innerText = `${typeName}: ${catName}`; let listData = modalDataLists[type][category]; let html = "";
        if(!listData || listData.length === 0) { html = `<div style="text-align:center; padding:30px; color:#7f8c8d;">ไม่มีข้อมูลในหมวดหมู่นี้ 🎉</div>`; } else { listData.forEach(item => { html += `<div class="list-item"><div><div class="list-title">[${item.code}] ${item.name}</div><div class="list-meta">${item.meta}</div></div></div>`; }); }
        document.getElementById('listModalBody').innerHTML = html; document.getElementById('listModal').style.display = 'flex';
    }
    
    function openMyTasksKPI(category) { 
        let catName = ""; if(category === 'owner') catName = "โปรเจกต์ที่ฉันคุม (ค้างอยู่)"; else if(category === 'assignee') catName = "งานย่อยที่ฉันต้องทำ (ค้างอยู่)"; else if(category === 'my_overdue') catName = "🚨 เลยกำหนดส่ง";
        document.getElementById('listModalTitleMyTasks').innerText = `งานของฉัน: ${catName}`; let listData = modalDataLists.mytasks[category]; let html = "";
        if(!listData || listData.length === 0) { html = `<div style="text-align:center; padding:30px; color:#7f8c8d;">ไม่มีงานในหมวดหมู่นี้ 🎉</div>`; } else { listData.forEach(item => { html += `<div class="list-item"><div><div class="list-title">[${item.code}] ${item.name}</div><div class="list-meta">${item.meta}</div></div></div>`; }); }
        document.getElementById('listModalBodyMyTasks').innerHTML = html; document.getElementById('listModalMyTasks').style.display = 'flex';
    }

    // 🚨 ฟังก์ชันใหม่: พับกางตารางเจาะลึก
    function toggleOverviewTable() {
        let container = document.getElementById('overviewTableContainer');
        let icon = document.getElementById('overviewToggleIcon');
        if(container.style.display === 'none') {
            container.style.display = 'block';
            icon.innerText = '▼';
            icon.style.transform = 'rotate(0deg)';
        } else {
            container.style.display = 'none';
            icon.innerText = '▶';
            icon.style.transform = 'rotate(-90deg)';
        }
    }

    // 🚨 อัปเดตดึงข้อมูล: ใส่รายชื่อแผนกและพนักงานลงในตัวกรองด้วย
    function loadSettingsDropdown() {
        google.script.run.withSuccessHandler(function(response) {
            try {
                if(!response || !response.auth.found) { document.body.innerHTML = '<div style="display:flex; height:100vh; justify-content:center; align-items:center; flex-direction:column; background:#ecf0f1; color:#2c3e50;"><h1 style="color:#e74c3c; font-size:40px; margin-bottom:10px;">🚫 ปฏิเสธการเข้าถึง</h1><h3>ไม่พบอีเมลของคุณในฐานข้อมูล Employees โปรดติดต่อหัวหน้างาน</h3></div>'; return; }
                globalDropdowns = response.dropdowns || globalDropdowns; globalDropdowns.employees = response.employeesGrouped || {}; userAuth = response.auth || userAuth;
                let navDash = document.getElementById('navDashboard'); if (navDash) navDash.style.display = (userAuth.overview === "YES") ? 'inline-block' : 'none';
                let tabAll = document.getElementById('tabArchAll'); if (tabAll) tabAll.style.display = (userAuth.overview === "YES") ? 'inline-block' : 'none';
                let createViewEl = document.getElementById('createView');
                
                if (userAuth.add !== "YES") { if(createViewEl) createViewEl.innerHTML = '<div class="panel" style="text-align:center; padding:80px 20px; color:#e74c3c;"><h2>🚫 ไม่มีสิทธิ์เข้าถึงหน้านี้</h2></div>'; } else {
                    populateSelect('mainBrand', globalDropdowns.brand); populateSelect('mainCategory', globalDropdowns.category); populateSelect('mainPriority', globalDropdowns.priority);
                    let allowedStatus = ["ยังไม่ได้เริ่ม", "กำลังทำ"]; document.getElementById('mainTaskStatus').innerHTML = allowedStatus.map(opt => `<option value="${opt}">${opt}</option>`).join('');
                    let empHtml = '<option value="">-- เลือกพนักงาน --</option>'; for (let dept in globalDropdowns.employees) { empHtml += `<optgroup label="📂 ${dept}">`; globalDropdowns.employees[dept].forEach(name => { empHtml += `<option value="${name}">${name}</option>`; }); empHtml += `</optgroup>`; }
                    let assignEl = document.getElementById('mainAssignee'); if(assignEl) assignEl.innerHTML = empHtml;
                    let approveEl = document.getElementById('mainApprover'); if(approveEl) approveEl.innerHTML = '<option value="">-- เลือกผู้อนุมัติ --</option>' + (globalDropdowns.approvers || []).map(opt => `<option value="${opt}">${opt}</option>`).join('');
                    let subCont = document.getElementById('subTasksContainer'); if(subCont && subCont.children.length === 0) addSubTask(); 
                }
                
                let userSelEl = document.getElementById('userSelector');
                if(userSelEl) {
                    if (userAuth.personal === "ALL") { let userSelHtml = ''; for (let dept in globalDropdowns.employees) { userSelHtml += `<optgroup label="📂 ${dept}">`; globalDropdowns.employees[dept].forEach(name => { userSelHtml += `<option value="${name}">${name}</option>`; }); userSelHtml += `</optgroup>`; } userSelEl.innerHTML = userSelHtml; userSelEl.value = userAuth.name; userSelEl.disabled = false; } else { userSelEl.innerHTML = `<option value="${userAuth.name}">${userAuth.name}</option>`; userSelEl.value = userAuth.name; userSelEl.disabled = true; }
                }

                // 🚨 สร้างตัวกรองแผนกและพนักงานสำหรับหน้า Dashboard
                let filterEmpHtml = '<option value="all">แสดงทุกคนทั้งหมด</option>';
                for (let dept in globalDropdowns.employees) { 
                    filterEmpHtml += `<optgroup label="📂 แผนก: ${dept}">`;
                    filterEmpHtml += `<option value="DEPT:${dept}">👉 ดูงานทั้งแผนก ${dept}</option>`;
                    globalDropdowns.employees[dept].forEach(name => { 
                        filterEmpHtml += `<option value="${name}">${name}</option>`; 
                    }); 
                    filterEmpHtml += `</optgroup>`; 
                }
                let filterAssEl = document.getElementById('filterAssignee');
                if(filterAssEl) filterAssEl.innerHTML = filterEmpHtml;

                loadDashboard(true);
            } catch(err) { alert("🚨 ข้อผิดพลาดในการจัดสิทธิ์: " + err.message); }
        }).withFailureHandler(function(err){ alert("🚨 โหลดข้อมูลตั้งค่าไม่ได้: " + err.message); }).getSettingsDropdown(); 
    }
    
    function populateSelect(elementId, optionsArray) { let el = document.getElementById(elementId); if(el && optionsArray) { el.innerHTML = optionsArray.map(opt => `<option value="${opt}">${opt}</option>`).join(''); } }

    function loadDashboard(isFirstLoad = false) {
        let progTable = document.getElementById('tableProjectProgress'); if(progTable) progTable.innerHTML = '<tr><td colspan="5" class="loading">กำลังซิงก์ข้อมูล...</td></tr>';
        google.script.run.withSuccessHandler(function(data) { 
            if (!data || !Array.isArray(data)) { rawData = []; } else { rawData = data; }
            applyFilter(); renderMyTasks(); renderArchive(); 
            if(isFirstLoad) { switchView('myTasksView', 'navMyTasks'); }
        }).withFailureHandler(function(err) { alert("🚨 ไม่สามารถโหลดข้อมูลโปรเจกต์ได้: " + err.message); if(progTable) progTable.innerHTML = '<tr><td colspan="5" class="text-center" style="color:red;">โหลดข้อมูลล้มเหลว โปรดรีเฟรชหน้าเว็บ</td></tr>'; }).getDashboardData();
    }

    function handlePresetChange() {
        const preset = document.getElementById('filterPreset').value; const customContainer = document.getElementById('customDateContainer'); const startInput = document.getElementById('filterStart'); const endInput = document.getElementById('filterEnd');
        if (preset === 'all') { customContainer.style.display = 'none'; startInput.value = ''; endInput.value = ''; applyFilter(); return; }
        if (preset === 'custom') { customContainer.style.display = 'inline-block'; return; }
        customContainer.style.display = 'none'; const now = new Date(); const y = now.getFullYear(); const m = now.getMonth(); let start, end;
        switch(preset) { case 'thisMonth': start = new Date(y, m, 1); end = new Date(y, m + 1, 0); break; case 'lastMonth': start = new Date(y, m - 1, 1); end = new Date(y, m, 0); break; case 'q1': start = new Date(y, 0, 1); end = new Date(y, 3, 0); break; case 'q2': start = new Date(y, 3, 1); end = new Date(y, 6, 0); break; case 'q3': start = new Date(y, 6, 1); end = new Date(y, 9, 0); break; case 'q4': start = new Date(y, 9, 1); end = new Date(y, 12, 0); break; case 'thisYear': start = new Date(y, 0, 1); end = new Date(y, 11, 31); break; }
        startInput.value = new Date(start.getTime() + (7 * 60 * 60 * 1000)).toISOString().split('T')[0]; endInput.value = new Date(end.getTime() + (7 * 60 * 60 * 1000)).toISOString().split('T')[0]; applyFilter();
    }

    // 🚨 อัปเดตระบบกรอง: ทำงานครอบคลุมทั้ง Priority, Assignee/Dept และวันที่
    function applyFilter() {
        try {
            let startInputEl = document.getElementById('filterStart'); let endInputEl = document.getElementById('filterEnd'); const sVal = startInputEl ? startInputEl.value : ""; const eVal = endInputEl ? endInputEl.value : "";
            let startFilter = (sVal && !isNaN(new Date(sVal).getTime())) ? new Date(sVal) : new Date(1900, 0, 1); let endFilter = (eVal && !isNaN(new Date(eVal).getTime())) ? new Date(eVal) : new Date(9999, 11, 31); endFilter.setHours(23, 59, 59);

            // ดึงค่าจากตัวกรองใหม่
            const prioFilter = document.getElementById('filterPriority') ? document.getElementById('filterPriority').value : "all";
            const empFilter = document.getElementById('filterAssignee') ? document.getElementById('filterAssignee').value : "all";

            modalDataLists.main = { active: [], pending: [], overdue: [], unfinished: [] }; modalDataLists.sub = { active: [], pending: [], overdue: [], unfinished: [] }; modalDataLists.perf = { created: [], completed: [] };
            let ownerStats = {}; let subStats = {}; let progressHtml = '';
            
            const now = new Date();
            const tZero = new Date(); tZero.setHours(0,0,0,0);

            let sortedProjects = (rawData || []).filter(p => p && p.code).sort((a, b) => String(a.code).localeCompare(String(b.code)));

            sortedProjects.forEach(p => {
                let pDate = parseDate(p.dueDate); 
                let pStartDate = parseDate(p.startDate);
                let prioText = p.priority || "-";
                let ownerName = p.owner ? p.owner.toString().trim() : "ไม่ระบุ"; 
                
                // 🚨 เช็กเงื่อนไขการกรอง
                let matchPrio = (prioFilter === "all" || prioText.includes(prioFilter));
                let matchEmp = false;

                if(empFilter === "all") {
                    matchEmp = true;
                } else if(empFilter.startsWith("DEPT:")) {
                    let targetDept = empFilter.replace("DEPT:", "");
                    if(globalDropdowns.employees[targetDept] && globalDropdowns.employees[targetDept].includes(ownerName)) matchEmp = true;
                    (p.subTasks || []).forEach(sub => {
                        let subAssArr = (sub.assignee || "").split(',').map(s=>s.trim());
                        subAssArr.forEach(sa => {
                            if(globalDropdowns.employees[targetDept] && globalDropdowns.employees[targetDept].includes(sa)) matchEmp = true;
                        });
                    });
                } else {
                    if(safeCompare(ownerName, empFilter)) matchEmp = true;
                    (p.subTasks || []).forEach(sub => {

    function renderMiniCalendar(year, month, datesMap) {
        let calHtml = ''; let firstDay = new Date(year, month, 1).getDay(); let daysInMonth = new Date(year, month + 1, 0).getDate(); let today = new Date();
        for(let i = 0; i < firstDay; i++) { calHtml += `<div></div>`; }
        for(let d = 1; d <= daysInMonth; d++) {
            let dKey = d + "/" + month + "/" + year; let cssClass = 'cal-date'; let inlineStyle = ''; let onClickEvent = '';
            if(datesMap[dKey]) { cssClass += datesMap[dKey].overdue ? ' overdue' : ' has-task'; onClickEvent = `onclick="openCalendarModal('${dKey}')"`; }
            if(d === today.getDate() && month === today.getMonth() && year === today.getFullYear()) { inlineStyle = 'border: 2px solid #34495e; font-weight:bold;'; }
            calHtml += `<div class="${cssClass}" style="${inlineStyle}" ${onClickEvent}>${d}</div>`;
        }
        let miniCalEl = document.getElementById('miniCalendarDates'); if(miniCalEl) miniCalEl.innerHTML = calHtml;
    }

            // 🚨 ไม่ลืมส่งค่า remark 
            const payload = { subId: document.getElementById('editSubId') ? document.getElementById('editSubId').value : '', subName: document.getElementById('editSubName') ? document.getElementById('editSubName').value : '', status: newStatus, resultLink: linkVal, remark: document.getElementById('editSubRemark') ? document.getElementById('editSubRemark').value : '', who: userAuth.name };
            
            if(payload.status === document.getElementById('editSubStatus').options[0].value) { alert("กรุณาเลือกเปลี่ยนสถานะก่อนกดบันทึกครับ"); if(btn) { btn.innerText = 'บันทึกการอัปเดต'; btn.disabled = false; } return; }
            google.script.run.withSuccessHandler(function(res) { 
                alert(res); closeEditModal(); if(btn) { btn.innerText = 'บันทึกการอัปเดต'; btn.disabled = false; } loadDashboard(false); 
            }).withFailureHandler(function(error) { alert("🚨 บันทึกไม่ได้: " + error.message); if(btn) { btn.innerText = 'บันทึกการอัปเดต'; btn.disabled = false; } }).updateSubTask(payload);
        } catch (e) { alert("🚨 เกิดข้อผิดพลาดหน้าเว็บ: " + e.message); if(btn) { btn.innerText = 'บันทึกการอัปเดต'; btn.disabled = false; } }
    }

    function deleteProject(mainCode) {
        if(confirm(`⚠️ คำเตือนสำคัญ!\n\nคุณกำลังจะลบโปรเจกต์ [${mainCode}] และงานย่อยที่เกี่ยวข้องทั้งหมดทิ้งอย่างถาวร\n\nการกระทำนี้ลบแล้วไม่สามารถกู้คืนได้ คุณแน่ใจหรือไม่?`)) {
            google.script.run.withSuccessHandler(function(res){ alert(res); loadDashboard(false); }).withFailureHandler(function(error) { alert("🚨 ลบไม่ได้: " + error.message); }).deleteProjectData(mainCode, userAuth.name);
        }
    }
</script>
